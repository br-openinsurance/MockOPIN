buildscript {
  repositories {
    mavenCentral()
  }
  dependencies {
    classpath 'org.yaml:snakeyaml:2.0'
  }
}

plugins {
  id 'java'
  id 'maven-publish'
}

def cfg = new org.yaml.snakeyaml.Yaml().load(new File("swagger.yaml").newInputStream())
String buildNumber = System.getenv("BUILD_NUMBER")

group = 'com.raidiam.trustframework.mockinsurance'
version = System.getenv("CHANGE_ID") ? "${System.getenv("BRANCH_NAME")}-SNAPSHOT" : "${cfg.info.version}.${buildNumber}"
println version

repositories {
  mavenCentral()
}

configurations {
  swaggerCodegen
}

def swaggerOutputDir = layout.buildDirectory.dir("generated/swagger").get().asFile

dependencies {
    swaggerCodegen 'io.swagger.codegen.v3:swagger-codegen-cli:3.0.61'

    annotationProcessor "io.micronaut:micronaut-inject-java:$micronautVersion"
    annotationProcessor "io.micronaut.validation:micronaut-validation:$micronautValidationVersion"

    implementation "io.micronaut:micronaut-inject:$micronautVersion"
    implementation "io.micronaut.validation:micronaut-validation:$micronautValidationVersion"
    implementation "io.micronaut:micronaut-runtime:$micronautVersion"

    implementation "io.swagger.core.v3:swagger-annotations:2.2.22"

    implementation 'jakarta.inject:jakarta.inject-api:2.0.1'
    implementation 'jakarta.validation:jakarta.validation-api:3.1.0'
    implementation "com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.22.0"
    implementation 'io.reactivex.rxjava2:rxjava:2.2.21'
}

tasks.register('generateSwaggerCode', JavaExec) {
  description = 'Generate code from swagger.yaml using Swagger Codegen'
  group = 'build'

  inputs.file('swagger.yaml')
  inputs.file('micronaut-config.json')
  inputs.dir('templates')
  outputs.dir(swaggerOutputDir)

  classpath = configurations.swaggerCodegen
  mainClass = 'io.swagger.codegen.v3.cli.SwaggerCodegen'

  args = [
          'generate',
          '-i', file('swagger.yaml').absolutePath,
          '-l', 'micronaut',
          '-o', swaggerOutputDir.absolutePath,
          '-c', file('micronaut-config.json').absolutePath,
          '-t', file('templates').absolutePath,
  ]

  doFirst {
    swaggerOutputDir.mkdirs()
  }
}

java {
  withSourcesJar()
  sourceCompatibility = JavaVersion.VERSION_21
  targetCompatibility = JavaVersion.VERSION_21
}

sourceSets.main.java.srcDir "${swaggerOutputDir}/src/main/java"
sourceSets.main.resources.srcDir "${swaggerOutputDir}/src/main/resources"

sourceSets {
  main {
    java {
      exclude '**/io/swagger/**'
    }
  }
}

compileJava.dependsOn generateSwaggerCode
processResources.dependsOn generateSwaggerCode
sourcesJar.dependsOn generateSwaggerCode

publishing {
  publications {
    mavenJava(MavenPublication) {
      from components.java
      artifact(file('swagger.yaml')) {
        classifier = 'swagger'
        extension = 'yaml'
      }
    }
  }
}
